[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "options-structure-trader"
version = "0.1.0"
description = "Standalone, replayable options-structure research and paper-trading service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "yfinance>=1.0",
  "exchange-calendars>=4.11",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
options-trader = "options_structure_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
